name: Gerar APK GolUp
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar codigo do GolUp
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK gerado
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GolUp-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
