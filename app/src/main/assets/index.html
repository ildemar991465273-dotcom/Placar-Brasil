:hidden;background:var(--panel)}.league-head{display:flex;gap:11px;align-items:center;background:#172634;padding:13px 14px;border-bottom:1px solid var(--line)}.flag{font-size:23px}.league-head small{color:var(--sub);display:block;margin-top:3px;font-size:11px}.match{display:flex;align-items:center;padding:16px 11px;border-bottom:1px solid var(--line);gap:8px;min-height:94px}.match:last-child{border:0}.club{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:700;font-size:13px}.club.away{justify-content:flex-end;text-align:right}.club label{overflow:hidden;text-overflow:ellipsis}.badge-team{font-size:19px;width:26px;text-align:center;flex-shrink:0}.score{text-align:center;min-width:89px}.score b{font-size:20px;letter-spacing:1px}.score small{display:block;font-size:10px;color:var(--sub);margin-top:3px}.score .live{color:var(--lime)}.star{background:none;border:0;color:#8296a8;font-size:22px;padding:1px}.star.on{color:var(--lime)}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#101d2bf2;border-top:1px solid var(--line);padding:10px 0 max(10px,env(safe-area-inset-bottom));z-index:3}.nav{background:transparent;color:var(--sub);border:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;width:25%}.nav i{font-style:normal;font-size:21px}.nav.active{color:var(--lime)}main{padding-bottom:94px;max-width:740px;margin:auto}.blank{text-align:center;margin:40px 18px;padding:29px 17px;background:var(--panel);border-radius:15px;color:var(--sub)}.blank big{font-size:32px;display:block;margin-bottom:13px}.detail{display:none;position:fixed;inset:0;z-index:5;background:var(--bg);overflow:auto;padding-bottom:30px}.detail.show{display:block}.back{margin:17px;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px}.hero{display:flex;align-items:center;justify-content:space-around;text-align:center;margin:32px 12px}.hero .hclub{width:33%;font-si .transfer-card{margin:10px 15px;padding:15px;border:1px solid var(--line);background:var(--panel);border-radius:13px}.transfer-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.transfer-head strong{font-size:15px}.transfer-meta{font-size:12px;color:var(--sub);line-height:1.7;margin-top:9px}.event{display:flex;gap:12px;border-left:2px solid #38546a;margin:0 17px;padding:13px 10px 13px 18px;background:var(--panel)}.event .minute{min-width:42px;color:var(--lime);font-weight:800}.event div{font-size:13px;line-height:1.5}.event small{display:block;color:var(--sub);margin-top:4px}.filterbar{display:flex;gap:8px;padding:10px 15px}.filterbar select{background:var(--panel);color:white;border:1px solid var(--line);padding:10px;border-radius:9px;flex:1;min-width:0}</style><style>

</style></head><body><header><div class="top"><div class="logo">Gol<span>Up</span><span class="demo" id="dataStatus">DEMONSTRAÇÃO</span></div><button class="circle" onclick="tab('settings')">⚙</button></div><div class="sports" id="sports"></div></header><main><div id="main"></div></main><div class="bottom" id="bottom"></div><div id="detail" class="detail"></div><div id="profileModal" class="detail" style="z-index:8"></div><script>
const WORLD={"Brasil 🇧🇷":["Brasileirão Série A","Brasileirão Série B","Série C","Série D","Copa do Brasil","Paulistão","Carioca","Mineiro","Gaúcho"],"Inglaterra 🏴":["Premier League","Championship","FA Cup","League One"],"Espanha 🇪🇸":["LaLiga","LaLiga 2","Copa del Rey"],"Itália 🇮🇹":["Serie A","Serie B","Coppa Italia"],"Alemanha 🇩🇪":["Bundesliga","2. Bundesliga","DFB-Pokal"],"França 🇫🇷":["Ligue 1","Ligue 2","Coupe de France"],"Portugal 🇵🇹":["Primeira Liga","Liga Portugal 2"],"Argentina 🇦🇷":["Liga Profesional","Copa Argentina"],"Estados Unidos 🇺🇸":["MLS","USL Championship"],"México 🇲🇽":["Liga MX"],"Colômbia 🇨🇴":["Primera A"],"Uruguai 🇺🇾":["Primera División"],"Chile 🇨🇱":["Primera División"],"Paraguai 🇵🇾":["Primera División"],"Bolívia 🇧🇴":["División Profesional"],"Peru 🇵🇪":["Liga 1"],"Equador 🇪🇨":["Serie A"],"Holanda 🇳🇱":["Eredivisie"],"Bélgica 🇧🇪":["Pro League"],"Turquia 🇹🇷":["Süper Lig"],"Grécia 🇬🇷":["Super League"],"Escócia 🏴":["Premiership"],"Arábia Saudita 🇸🇦":["Saudi Pro League"],"Japão 🇯🇵":["J1 League"],"Coreia do Sul 🇰🇷":["K League 1"],"China 🇨🇳":["Super League"],"Índia 🇮🇳":["Indian Super League"],"Austrália 🇦🇺":["A-League"],"África do Sul 🇿🇦":["Premier Division"],"Egito 🇪🇬":["Premier League"],"Marrocos 🇲🇦":["Botola Pro"],"Nigéria 🇳🇬":["NPFL"],"Suíça 🇨🇭":["Super League"],"Áustria 🇦🇹":["Bundesliga"],"Dinamarca 🇩🇰":["Superliga"],"Noruega 🇳🇴":["Eliteserien"],"Suécia 🇸🇪":["Allsvenskan"],"Polônia 🇵🇱":["Ekstraklasa"],"República Tcheca 🇨🇿":["First League"],"Sérvia 🇷🇸":["SuperLiga"],"Croácia 🇭🇷":["HNL"],"Ucrânia 🇺🇦":["Premier League"],"Competições internacionais 🌐":["Copa do Mundo","Champions League","Europa League","Conference League","Libertadores","Sul-Americana","Copa América","Eurocopa","Champions League da Ásia","Copa Africana de Nações"]};
let worldSearch='';let account=localStorage.getItem('golup_account')||'';let activeMatch=null;const CHAT_LIMIT=250;
function saveAccount(){const el=document.getElementById('accountName');const name=(el?.value||'').trim().slice(0,25);if(name.length<3){alert('Informe um apelido com pelo menos 3 caracteres.');return}account=name;localStorage.setItem('golup_account',name);render()}
function fireworksRemaining(){return Number(localStorage.getItem('golup_fire_'+account)??4)}
function useFirework(){if(!account){alert('Crie um apelido na aba Conta para participar.');return}let left=fireworksRemaining();if(left<=0){alert('Seus 4 fogos grátis acabaram. Futuros fogos custarão R$ 0,50 cada, após ativação do pagamento seguro pelo Google Play. As compras ainda não estão habilitadas.');return}localStorage.setItem('golup_fire_'+account,String(left-1));const fx=document.createElement('div');fx.className='firework';fx.textContent='🎆🎇🎆';document.body.appendChild(fx);setTimeout(()=>fx.remove(),1600);renderChat()}
function chatKey(){return 'golup_chat_'+activeMatch}
function alertSettings(){try{return JSON.parse(localStorage.getItem('golup_alerts')||'{"enabled":true,"sound":true,"vibration":true,"favoriteOnly":true}')}catch{return {enabled:true,sound:true,vibration:true,favoriteOnly:true}}}
function setAlert(key,value){const p=alertSettings();p[key]=value;localStorage.setItem('golup_alerts',JSON.stringify(p));render()}
function goalChime(){try{let ctx=new (window.AudioContext||window.webkitAudioContext)();[660,880,1100].forEach((hz,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(0.0001,ctx.currentTime+i*.15);g.gain.exponentialRampToValueAtTime(.16,ctx.currentTime+i*.15+.025);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.15+.24);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*.15);o.stop(ctx.currentTime+i*.15+.26)})}catch(e){}}
function testGoalNotification(){const p=alertSettings();if(!p.enabled){alert('Ative as notificações de gol para testar.');return}if(p.sound)goalChime();if(p.vibration&&navigator.vibrate)navigator.vibrate([120,75,160]);if(window.GolUpAndroid&&window.GolUpAndroid.testGoal){window.GolUpAndroid.testGoal(p.sound,p.vibration)}else if('Notification' in window&&Notification.permission==='granted'){new Notification('⚽ GOOOL! • GolUp',{body:'Teste de alerta de gol no celular'})}else{alert('⚽ GOOOL! Teste de notificação. No aplicativo Android, um alerta aparecerá na barra de notificações (com permissão).')}}
function alertSettingsHtml(){const p=alertSettings();return `<div class="settings"><h3>🔔 Notificações de gol</h3><p class="sub">Escolha como quer receber os alertas no seu celular.</p>${[['enabled','Receber notificações de gol'],['sound','Som de gol'],['vibration','Vibrar ao sair gol'],['favoriteOnly','Avisar somente jogos favoritos']].map(([k,label])=>`<label style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;gap:10px"><span>${label}</span><input style="width:23px;height:23px;accent-color:#b8fc4c" type="checkbox" ${p[k]?'checked':''} onchange="setAlert('${k}',this.checked)"/></label>`).join('')}<button onclick="testGoalNotification()">⚽ Testar som e notificação de gol</button><p class="warning">Teste local funcional no Android mediante permissão. Alertas automáticos de gols reais, inclusive com o app fechado, ainda dependem de API ao vivo, servidor e push.</p></div>`}
function getMessages(){try{return JSON.parse(localStorage.getItem(chatKey())||'[]')}catch{return []}}
function sendChat(){if(!account){alert('Crie seu apelido na aba Conta para comentar.');return}let field=document.getElementById('chatInput');let message=(field?.value||'').trim().slice(0,250);if(!message)return;let msgs=getMessages();msgs.push({user:account,txt:message,at:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});localStorage.setItem(chatKey(),JSON.stringify(msgs.slice(-CHAT_LIMIT)));renderChat()}
function renderChat(){let el=document.getElementById('chatArea');if(!el)return;const msgs=getMessages();el.innerHTML=`<div class="chat-feed">${msgs.length?msgs.map(m=>`<div class="bubble"><small>${esc(m.user)} • ${esc(m.at)}</small><div>${esc(m.txt)}</div></div>`).join(''):'<p class="sub">Seja o primeiro a comentar nesta demonstração.</p>'}</div><div class="chat-form"><input id="chatInput" maxlength="250" placeholder="Escreva sobre o jogo..."/><button class="action" onclick="sendChat()">Enviar</button></div><p class="warning">Chat de demonstração: mensagens salvas somente neste aparelho. O chat público entre usuários exigirá autenticação real, servidor, moderação, denúncia e bloqueio.</p><button class="action alt" onclick="useFirework()">🎆 Soltar fogos • ${account?fireworksRemaining():4} grátis restantes</button><p class="sub">Depois: R$ 0,50 por fogo. Compra real ainda indisponível.</p>`}
function renderWorld(term=''){worldSearch=term;let el=document.getElementById('worldResults');if(!el)return;let items=Object.entries(WORLD).flatMap(([country,leagues])=>leagues.map(league=>({country,league}))).filter(x=>(x.country+' '+x.league).toLowerCase().includes(term.toLowerCase()));el.innerHTML=`<p class="world-note">${items.length} competições no catálogo demonstrativo. Jogos reais dessas ligas dependerão da cobertura e integração da API contratada.</p>`+items.map(x=>`<div class="world-item"><span>🏆</span><div><b>${esc(x.league)}</b><small>${esc(x.country)}</small></div></div>`).join('')}

(function(){

  function initials(name){let parts=String(name||'').replace(/[^A-Za-zÀ-ÿ0-9 ]/g,' ').trim().split(/\s+/).filter(Boolean); if(!parts.length) return 'GUP'; if(parts.length===1) return parts[0].slice(0,3).toUpperCase(); return (parts[0][0]+parts[1][0]+(parts[2]?parts[2][0]:'')).toUpperCase()}

    if(tabName!=='games') return;

    main.insertBefore(box, main.firstChild.nextSibling || main.firstChild);
  }
  function hash(s){let n=0; String(s||'').split('').forEach(ch=>n=(n*31+ch.charCodeAt(0))%100000); return n;}
  function premiumPrediction(g){
    let seed=(hash(g.a)+hash(g.b)+g.id*17)%100;
    let home=35+(seed%31), draw=18+(seed%13), away=Math.max(8,100-home-draw);
    if(away>55){ let cut=away-55; away-=cut; draw+=cut; }
    let sa=(seed%3)+(home>away?1:0), sb=(Math.floor(seed/7)%3)+(away>home?1:0); if(sa===sb) sa += home>=away?1:0;

    let cards=(3 + (seed%3))+' a '+(6 + (seed%4));
    let win = home>=away && home>=draw ? g.a : away>home && away>=draw ? g.b : 'Empate';
    return {home,draw,away,score:sa+' x '+sb,corners,cards,win};
  }
  function injectPremiumMini(){

    let main=document.getElementById('main'); if(!main || document.getElementById('premiumMini')) return;
    let box=document.createElement('div'); box.className='premium-mini'; box.id='premiumMini';
    box.innerHTML='<h3>🔒 GolUp Premium</h3><p>Desbloqueie análises pagas de confronto: quem tende a vencer, placar provável, estimativa de escanteios e cartões.</p><button class="action" onclick="tab(\'settings\');setTimeout(function(){document.getElementById(\'premiumZone\')?.scrollIntoView({behavior:\'smooth\'})},80)">Ver produtos premium</button>';
    let anchor=main.querySelector('#results') || main.lastChild; if(anchor) main.insertBefore(box, anchor); else main.appendChild(box);
  }
  function injectPremiumZone(){
    if(tabName!=='settings') return;
    let main=document.getElementById('main'); if(!main || document.getElementById('premiumZone')) return;
    let sec=document.createElement('section'); sec.className='premium-card'; sec.id='premiumZone';
    sec.innerHTML='<div class="premium-head"><div><strong>GolUp Premium</strong><p class="sub">Produtos pagos para quem quer análise mais completa dos confrontos.</p></div><span class="premium-badge">PREMIUM</span></div>'+
      '<div class="premium-products">'+
      '<article><h4>Análise de confronto</h4><p>Quem vai vencer, dupla chance, tendência do placar, número provável de escanteios e cartões.</p><span class="price">R$ 4,99 por confronto</span></article>'+
      '<article><h4>GolUp Premium Mensal</h4><p>Acesso às análises dos jogos, comparativo entre equipes e leitura premium das estatísticas.</p><span class="price">R$ 14,90 / mês</span></article>'+
      '<article><h4>Pacote Pro Diário</h4><p>Use análises premium liberadas por 24 horas para acompanhar rodadas e clássicos.</p><span class="price">R$ 2,99 / dia</span></article>'+
      '</div><div class="premium-lock">As análises abaixo são demonstrativas. Para funcionar com cobrança real, ainda é preciso integrar Google Play Billing e um backend de validação.</div>'+
      '<div class="premium-actions"><button class="action" onclick="alert(\'Demonstração: compra premium ainda não integrada ao Google Play.\')">Comprar produto premium</button><button class="action alt" onclick="alert(\'Nesta versão, os preços e telas premium são demonstrativos.\')">Saiba como funciona</button></div>';
    main.appendChild(sec);
  }
  function injectDetailPremium(id){
    let modal=document.getElementById('detail'); if(!modal || !modal.classList.contains('show')) return;
    let anchor=modal.querySelector('.notice:last-of-type'); if(!anchor) return;
    let old=modal.querySelector('#premiumMatchCard'); if(old) old.remove();
    let game=(window.liveGames||window.demo||[]).find(function(x){return x.id===id}) || (window.demo||[]).find(function(x){return x.id===id});
    if(!game) return;
    let p=premiumPrediction(game);
    let card=document.createElement('article'); card.className='premium-card'; card.id='premiumMatchCard';
    card.innerHTML='<div class="premium-head"><div><strong>🔒 Análise premium do confronto</strong><p class="sub">Leitura avançada baseada em forma, força ofensiva e comportamento estatístico.</p></div><span class="premium-badge">PAGA</span></div>'+
      '<div class="premium-grid">'+
      '<div><span>Quem vai vencer</span><b>'+h(p.win)+'</b></div>'+
      '<div><span>Placar provável</span><b>'+h(p.score)+'</b></div>'+
      '<div><span>Escanteios previstos</span><b>'+h(p.corners)+'</b></div>'+
      '<div><span>Cartões previstos</span><b>'+h(p.cards)+'</b></div>'+
      '<div><span>'+h(game.a)+'</span><b>'+p.home+'%</b></div>'+
      '<div><span>'+h(game.b)+'</span><b>'+p.away+'%</b></div>'+
      '</div><div class="premium-lock">Prévia exibida como demonstração. O desbloqueio definitivo exige compra no app e motor de análise conectado ao backend.</div>'+
      '<div class="premium-actions"><button class="action" onclick="alert(\'Demonstração: compra ainda não ativada.\')">Desbloquear análise</button><button class="action alt" onclick="tab(\'settings\');closeDetail();setTimeout(function(){document.getElementById(\'premiumZone\')?.scrollIntoView({behavior:\'smooth\'})},120)">Ver planos</button></div>';
    anchor.insertAdjacentElement('beforebegin', card);
  }
  function redrawFavoriteBanner(){
    if(tabName!=='games') return;
    document.querySelectorAll('.team-flag').forEach(function(flag){
      if(flag.dataset.upgraded) return;
      let m=(flag.textContent||'').match(/torce para\s+(.*?)(Ver jogos|$)/i);
      let club=(window.favoriteClub||localStorage.getItem('golup_favorite_club')||'').trim() || (m?m[1].trim():'');
      if(!club) return;
      flag.dataset.upgraded='1';
      flag.innerHTML='<div class="fav-club-inline" data-club="'+h(club)+'"></div><div style="margin-top:10px;color:var(--sub);font-size:12px">Os jogos e o tema do app podem priorizar seu clube favorito.</div><button id="favClubSearchBtn">Ver jogos do meu time →</button>';
      var btn=flag.querySelector('#favClubSearchBtn');
      if(btn) btn.onclick=function(){ tab('search'); search=club; render(); };
    });
  }
  const oldDrawClubPicker=window.drawClubPicker;
  window.drawClubPicker=function(resetSearch){
    let el=document.getElementById('teamOnboard'); if(!el) return oldDrawClubPicker?oldDrawClubPicker(resetSearch):null;
    let query=(window.favoriteClubQuery||'').trim().toLowerCase();
    let candidates=(window.CLUB_SUGGESTIONS||[]).filter(function(x){return (x[0]+' '+x[1]).toLowerCase().includes(query)}).slice(0,20);
    let custom=(window.favoriteClubQuery||'').trim();
    el.innerHTML='<div class="team-shell app-tinted"><div style="color:var(--lime);font-weight:1000;font-size:24px">GolUp ⚡</div><h1>Escolha seu time do coração</h1><p>O tema do aplicativo vai mudar conforme as cores do clube escolhido. Os escudos abaixo são estilizados para demonstração.</p><input class="team-input" id="clubQuery" maxlength="65" placeholder="Buscar time ou país..." value="'+h(window.favoriteClubQuery||'')+'" oninput="clubSearchChanged(this.value)"/><div id="clubMatches">'+
      candidates.map(function(c){return '<button class="team-option '+(window.favoriteClubChoice===c[0]?'chosen':'')+'" onclick="chooseFavoriteClub('+JSON.stringify(c[0]).replace(/"/g,'&quot;')+',\'\')">'+logoHtml(c[0],'sm')+'<div><div>'+h(c[0])+'</div><small>'+h(c[1])+'</small></div></button>'}).join('')+
      (custom && !candidates.some(function(c){return c[0].toLowerCase()===custom.toLowerCase()}) ? '<button class="team-option '+(window.favoriteClubChoice===custom?'chosen':'')+'" id="clubCustom">'+logoHtml(custom,'sm')+'<div><div>Usar “'+h(custom)+'”</div><small>Clube personalizado</small></div></button>' : '')+
      '</div><p style="font-size:12px">As logos exibidas aqui são representações visuais internas do app. Você poderá trocar seu time quando quiser.</p><button class="team-btn" id="saveClub" '+(!window.favoriteClubChoice?'disabled':'')+'>Continuar com meu time</button><button style="display:block;margin:15px auto 0;color:#a6bacb;background:none;border:0" id="laterClub">Escolher depois</button></div>';
    let customBtn=document.getElementById('clubCustom'); if(customBtn) customBtn.onclick=function(){ chooseFavoriteClub(custom,'') };
    document.getElementById('saveClub').onclick=saveFavoriteClub;
    document.getElementById('laterClub').onclick=function(){ localStorage.setItem('golup_club_prompt_seen','1'); el.classList.remove('open') };
    if(resetSearch===false){ let input=document.getElementById('clubQuery'); if(input){ input.focus(); input.setSelectionRange(input.value.length,input.value.length); } }
  };
  const oldChooseFavoriteClub=window.chooseFavoriteClub;
  window.chooseFavoriteClub=function(name,mark){ window.favoriteClubChoice=name; window.favoriteClubIcon=''; window.drawClubPicker(false); };
  const oldSaveFavoriteClub=window.saveFavoriteClub;
  window.saveFavoriteClub=function(){ if(!window.favoriteClubChoice) return; if(oldSaveFavoriteClub) oldSaveFavoriteClub(); applyTheme(); setTimeout(function(){ enhanceListLogos(); redrawFavoriteBanner(); injectThemeChip(); },10) };
  const baseRender=window.render;
  window.render=function(){ if(baseRender) baseRender(); applyTheme(); enhanceListLogos(); injectThemeChip(); injectPremiumMini(); injectPremiumZone(); redrawFavoriteBanner(); };
  const baseDetail=window.detail;
  window.detail=function(id){ if(baseDetail) baseDetail(id); applyTheme(); enhanceListLogos(); injectDetailPremium(id); };
  const baseCloseDetail=window.closeDetail;
  window.closeDetail=function(){ if(baseCloseDetail) baseCloseDetail(); let card=document.getElementById('premiumMatchCard'); if(card) card.remove(); };
  applyTheme();
  setTimeout(function(){ try{ render(); }catch(e){} },20);
})();
</script>

<script id="golup27-search">
(function(){
const tidy=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
let chosenDay=localStorage.getItem('golup_search_day')||today();
let query='',country='all',status='all',games=[],loading=false,error='',real=false,requestId=0;
function dayLabel(s){if(!s)return '';let d=new Date(s+'T12:00:00');return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'long',year:'numeric'})}
function demoForDay(){let nowDay=today();return chosenDay===nowDay ? (window.demo||[]) : []}
function matchFilter(g){if(query&&!String(g.a+' '+g.b+' '+g.league+' '+g.country).toLocaleLowerCase('pt-BR').includes(query.toLocaleLowerCase('pt-BR')))return false;if(country!=='all'&&g.country!==country)return false;if(status==='live'&&!g.live)return false;if(status==='finished'&&(!['FT','AET','PEN','Match Finished'].some(x=>String(g.status).includes(x))))return false;if(status==='scheduled'&&(g.live||String(g.status).match(/FT|AET|PEN|Finished/)))return false;return true;}
function renderSearchWorld(){let box=document.getElementById('main');if(!box||tabName!=='search')return;
const countries=[...new Set(games.map(g=>g.country).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
if(country!=='all'&&!countries.includes(country))country='all';
let list=games.filter(matchFilter).sort((a,b)=>String(a.league).localeCompare(String(b.league),'pt-BR'));
let grouped={};list.forEach(g=>{let key=(g.country||'Mundo')+' • '+(g.league||'Competição');(grouped[key]??=[]).push(g)});
let cards=Object.entries(grouped).map(([name,items])=>'<section class="league"><div class="league-head"><span class="flag">🌍</span><div><b>'+tidy(name)+'</b><small>'+items.length+' partida(s)</small></div></div>'+items.map(g=>'<div class="match"><button class="star '+(favorites.has(g.id)?'on':'')+'" data-fav="'+tidy(g.id)+'">'+(favorites.has(g.id)?'★':'☆')+'</button><div class="club"><span class="badge-team">'+tidy(g.ea||'⚽')+'</span><label>'+tidy(g.a)+'</label></div><div class="score"><b>'+tidy(g.score||'–')+'</b><small class="'+(g.live?'live':'')+'">'+tidy(g.status||'Agendado')+'</small></div><div class="club away"><label>'+tidy(g.b)+'</label><span class="badge-team">'+tidy(g.eb||'⚽')+'</span></div></div>').join('')+'</section>').join('');
box.innerHTML=`<h1 class="title">🔎 Procurar jogos no mundo</h1><p class="world-note">Escolha qualquer data para buscar partidas do dia, por país, time ou competição.</p><div class="search-head"><div><label for="worldDay">📅 Data dos jogos</label><input type="date" id="worldDay" value="${tidy(chosenDay)}" /></div><button class="action alt" id="worldToday">Hoje</button></div><input class="search" id="worldQuery" placeholder="Time, país ou campeonato…" value="${tidy(query)}"/><div class="filterbar"><select id="worldCountry"><option value="all">Todos os países</option>${countries.map(c=>'<option value="'+tidy(c)+'" '+(c===country?'selected':'')+'>'+tidy(c)+'</option>').join('')}</select><select id="worldStatus"><option value="all">Todos os jogos</option><option value="live" ${status==='live'?'selected':''}>Ao vivo</option><option value="scheduled" ${status==='scheduled'?'selected':''}>Agendados</option><option value="finished" ${status==='finished'?'selected':''}>Encerrados</option></select></div><div class="search-summary"><b>${tidy(dayLabel(chosenDay))}</b><span>${loading?'Consultando...':list.length+' jogo(s) encontrado(s)'}</span><button class="action alt" id="worldRefresh">↻ Atualizar</button></div><p class="world-note">${real?'Resultados consultados na API-Football para a data escolhida. Cobertura depende do plano e do provedor.': 'Demonstração — sem consulta online. Os exemplos abaixo não são jogos reais.'}</p>${error?'<p class="world-note" style="color:#f3bd8b">'+tidy(error)+'</p>':''}<div id="worldResultList">${loading?'<div class="blank">Carregando os jogos da data escolhida…</div>':cards||'<div class="blank">⚽ Nenhuma partida encontrada nesta busca. Experimente outra data, país ou termo.</div>'}</div>`;
box.querySelector('#worldDay').addEventListener('change',e=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(e.target.value))return;chosenDay=e.target.value;localStorage.setItem('golup_search_day',chosenDay);loadDay()});
box.querySelector('#worldToday').addEventListener('click',()=>{chosenDay=today();localStorage.setItem('golup_search_day',chosenDay);loadDay()});
box.querySelector('#worldQuery').addEventListener('input',e=>{query=e.target.value;const pos=e.target.selectionStart; renderSearchWorld();let input=document.getElementById('worldQuery');input.focus();input.setSelectionRange(pos,pos)});
box.querySelector('#worldCountry').addEventListener('change',e=>{country=e.target.value;renderSearchWorld()});
box.querySelector('#worldStatus').addEventListener('change',e=>{status=e.target.value;renderSearchWorld()});
box.querySelector('#worldRefresh').addEventListener('click',()=>loadDay());
box.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',()=>{let id=Number(b.dataset.fav);toggle(id);renderSearchWorld()}));
box.querySelectorAll('.match').forEach((m,i)=>{let g=list[i]; if(g) m.querySelectorAll('.club,.score').forEach(el=>el.addEventListener('click',()=>{if(real) liveGames=games; detail(g.id)})) });
if(typeof window.enhanceListLogos==='function')window.enhanceListLogos();
}
async function loadDay(){let id=++requestId;error='';loading=true;renderSearchWorld();let base=apiBase||'';
try{if(!base){real=false;games=demoForDay();error='Para consultar campeonatos de todos os países, configure o servidor GolUp em Conta.';return}
let data=await apiCall('fixtures',{date:chosenDay});if(id!==requestId)return;
if(!Array.isArray(data))throw Error('Resposta de partidas inválida');
games=data;real=true;
}catch(e){if(id!==requestId)return;real=false;games=demoForDay();error='Servidor indisponível ou API sem cobertura: '+(e.message||'erro desconhecido')}
finally{if(id===requestId){loading=false;renderSearchWorld()}}
}
const priorRender=window.render;
window.render=function(){if(priorRender)priorRender();if(tabName==='search'){renderSearchWorld();if(!games.length && !loading && !real && !error) loadDay();}};
const priorTab=window.tab;
window.tab=function(name){if(priorTab)priorTab(name);if(name==='search')loadDay()};
})();
</script>
<style id="golup27-style">.search-head{display:flex;align-items:end;gap:10px;margin:10px 16px}.search-head>div{flex:1}.search-head label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}.search-head input{color:var(--txt);color-scheme:dark;background:var(--panel);border:1px solid var(--line);padding:13px;border-radius:11px;width:100%;font:inherit}.search-summary{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:12px 16px}.search-summary b{font-size:12px}.search-summary span{color:var(--sub);font-size:11px}.search-summary button{font-size:11px;padding:8px}.match .club,.match .score{cursor:pointer}</style>
<style>#clubMatches{max-height:38vh;overflow-y:auto;overscroll-behavior:contain;margin-top:8px;scrollbar-width:thin}#teamOnboard{padding-bottom:48px}.team-shell{margin:12px auto}.team-option{font-size:15px}</style></body></html>
