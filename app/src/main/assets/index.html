<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GolUp</title><style>:root{--a:#b8fc4c;--bg:#09131e;--panel:#172635}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef5ff;font:15px system-ui}header{padding:20px 18px;background:#111e2b;position:sticky;top:0;z-index:4;border-bottom:1px solid #354354}h1{margin:0;font-size:28px}h1 span{color:var(--a)}main{padding:15px 14px 100px;max-width:680px;margin:auto}nav{position:fixed;bottom:0;left:0;right:0;background:#101e2b;display:flex;overflow:auto;z-index:5;border-top:1px solid #334356}button{border:0;cursor:pointer}nav button{background:none;color:#eaf2fa;min-width:16.5%;padding:12px 4px;font-size:10px}nav button.active{color:var(--a)}.card{padding:15px;border-radius:15px;background:var(--panel);margin-bottom:12px;border:1px solid #334353}.small{font-size:12px;color:#acb9cb}.row{display:flex;justify-content:space-between;align-items:center;gap:9px}.team{display:flex;align-items:center;gap:8px}.mark{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--a);color:#09131e;font-weight:900;font-size:11px}.btn{padding:12px 16px;background:var(--a);color:#09131e;font-weight:800;border-radius:10px}.choice{background:#243548;color:#fff;padding:11px;border-radius:10px;margin:3px}.choice.sel{outline:2px solid var(--a)}input,select{background:#1a2e40;color:white;padding:12px;border:1px solid #42566a;border-radius:10px;max-width:100%;width:100%;margin:6px 0}.lock{color:#ffcd78;font-size:12px}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid div{padding:14px;background:#223549;border-radius:12px}#modal{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:9;padding:20px;display:none}.pill{color:var(--a);font-weight:800}a{color:var(--a)}h2{font-size:20px}</style></head><body><header><h1>Gol<span>Up ⚡</span></h1><div class="small">Futebol mundial • Minha torcida • Placar</div></header><main id="app"></main><nav id="nav"></nav><div id="modal"></div><script>
const clubs=[['Flamengo','#dd1a33'],['Corinthians','#e0e0e0'],['Palmeiras','#18a05e'],['Cruzeiro','#2760eb'],['Atlético-MG','#d0d0d0'],['São Paulo','#d51f30'],['Vasco','#eeeeee'],['Botafogo','#dddddd'],['Grêmio','#2d9cd4'],['Internacional','#ef212a'],['Santos','#f2f2f2'],['Fluminense','#8b1d4d'],['Real Madrid','#eaeaea'],['Barcelona','#1c62c4'],['Liverpool','#e11b32'],['Arsenal','#e11b32'],['Manchester City','#70bbf2'],['Bayern','#db1f32'],['Juventus','#dddddd'],['PSG','#2755ac'],['Ajax','#e53038']];
let favorite=localStorage.getItem('golupClub')||'',section='home',q='',selectedDate=new Date().toISOString().slice(0,10),alerts=true,free=Number(localStorage.getItem('golupFree')??4);
let games=[{id:1,a:'Flamengo',b:'Palmeiras',score:'2 – 1',league:'Brasileirão',status:'DEMO 67′'},{id:2,a:'Cruzeiro',b:'Atlético-MG',score:'0 – 0',league:'Brasileirão',status:'DEMO 19:30'},{id:3,a:'Real Madrid',b:'Barcelona',score:'–',league:'LaLiga',status:'DEMO 21:00'},{id:4,a:'Liverpool',b:'Arsenal',score:'1 – 1',league:'Premier League',status:'DEMO 82′'}];
const esc=v=>String(v??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
function mark(c){return '<span class="mark" style="background:'+(clubs.find(x=>x[0]===c)?.[1]||'#b8fc4c')+'">'+esc(c).slice(0,3).toUpperCase()+'</span>'}
function theme(){document.documentElement.style.setProperty('--a',clubs.find(c=>c[0]===favorite)?.[1]||'#b8fc4c')}
function nav(){document.getElementById('nav').innerHTML=[['home','⚽<br>Jogos'],['search','🔎<br>Buscar'],['club','❤️<br>Meu time'],['transfers','🔄<br>Mercado'],['premium','👑<br>Premium'],['account','⚙️<br>Conta']].map(([id,t])=>'<button class="'+(section===id?'active':'')+'" onclick="section=\''+id+'\';render()">'+t+'</button>').join('')}
function picker(){return '<h2>❤️ Escolha seu time do coração</h2><p class="small">O tema muda com a cor do seu time. Escudos ilustrativos.</p><input id="teamfilter" placeholder="Pesquisar time" oninput="drawClubs(this.value)"><div id="teamlist"></div>'}
function drawClubs(v=''){document.getElementById('teamlist').innerHTML=clubs.filter(x=>x[0].toLowerCase().includes(v.toLowerCase())).map(([c])=>'<button class="choice '+(favorite===c?'sel':'')+'" onclick="favorite=\''+c+'\';localStorage.setItem(\'golupClub\',favorite);render()">'+mark(c)+' '+c+'</button>').join('')}
function matchHtml(g){return '<div class="card" onclick="openMatch('+g.id+')"><div class="small">'+esc(g.league)+' • '+esc(g.status)+'</div><div class="row"><div class="team">'+mark(g.a)+esc(g.a)+'</div><b>'+g.score+'</b><div class="team">'+mark(g.b)+esc(g.b)+'</div></div></div>'}
function viewMatches(){let filtered=games.filter(g=>(g.a+' '+g.b+' '+g.league).toLowerCase().includes(q.toLowerCase()));return filtered.map(matchHtml).join('')||'<div class="card">Nenhuma partida demonstrativa encontrada. Conecte a API para ver jogos reais.</div>'}
function render(){theme();nav();let h='';
if(section==='home')h='<h2>Jogos e resultados</h2><div class="card small">⚠️ Placar demonstrativo. Resultados reais exigem servidor e chave da API-Football.</div>'+viewMatches()+'<button class="btn" onclick="section=\'search\';render()">🌍 Buscar jogos do mundo</button>';
if(section==='search')h='<h2>🌍 Busca mundial</h2><div class="card">Data dos jogos<input type="date" value="'+selectedDate+'" onchange="selectedDate=this.value"><input placeholder="Clube ou campeonato" value="'+esc(q)+'" oninput="q=this.value;document.getElementById(\'found\').innerHTML=viewMatches()"><div id="found">'+viewMatches()+'</div><p class="small">Selecione o dia para a futura consulta da API. Esta versão não oferece resultados de datas reais.</p></div>';
if(section==='club')h='<div class="card">'+(favorite?'<div class="row"><div>'+mark(favorite)+' <b>'+esc(favorite)+'</b><div class="small">Seu time do coração</div></div></div>':'')+picker()+'</div>';
if(section==='transfers')h='<h2>🔄 Mercado da bola</h2><div class="card">Transferências e rumores mundiais serão mostrados aqui após integração com uma fonte confiável. Não há transferências fictícias apresentadas como notícias reais.</div>';
if(section==='premium')h='<h2>👑 GolUp Premium</h2><div class="card"><b>Análise de confronto</b><p>Vencedor provável, placar estimado, escanteios e cartões.</p><b class="pill">R$ 4,99 por confronto</b></div><div class="card"><b>Plano mensal</b><p>Análises e estatísticas avançadas.</p><b class="pill">R$ 14,90/mês</b></div><div class="card"><b>Pacote diário</b><p>Acesso por 24 horas.</p><b class="pill">R$ 2,99/dia</b></div><p class="lock">🔒 Produtos demonstrativos. Pagamentos e previsões reais ainda não foram ativados.</p>';
if(section==='account')h='<h2>⚙️ Torcedor</h2><div class="card">Seu apelido<input id="nick" value="'+esc(localStorage.getItem('golupNick')||'')+'" placeholder="Nome do torcedor"><button class="btn" onclick="localStorage.setItem(\'golupNick\',document.getElementById(\'nick\').value)">Salvar</button></div><div class="card"><h3>🎆 Fogos de comemoração</h3><p>Grátis restantes: '+free+' / 4</p><button class="btn" onclick="firework()">Soltar fogos</button><p>Fogos extras: R$ 0,50 • compra ainda não habilitada.</p></div><div class="card"><h3>🔔 Notificação de gol</h3><button class="btn" onclick="if(window.GolUpAndroid)GolUpAndroid.testGoal(true,true);else alert(\'Teste disponível no APK Android\')">Testar som e vibração</button></div><div class="card">Chat da torcida: precisa de conta online e servidor.</div>';
document.getElementById('app').innerHTML=h;if(section==='club')drawClubs();}
function firework(){if(free<=0){alert('Fogos gratuitos acabaram. Compra a R$ 0,50 ainda não ativada.');return}free--;localStorage.setItem('golupFree',free);alert('🎆🎆🎆 GOOOOOL! 🎆🎆🎆');render()}
function openMatch(id){let g=games.find(x=>x.id===id);let m=document.getElementById('modal');m.style.display='block';m.innerHTML='<button class="btn" onclick="document.getElementById(\'modal\').style.display=\'none\'">← Voltar</button><h2>'+esc(g.a)+' x '+esc(g.b)+'</h2><div class="card"><div class="row">'+mark(g.a)+' <b>'+esc(g.score)+'</b> '+mark(g.b)+'</div><p class="small">Escalações, jogadores e narração escrita dependem da API.</p></div><div class="card"><b>🔒 Análise Premium</b><p>Provável vencedor, placar, cartões e escanteios.</p><p class="lock">Não há previsão real habilitada. Nenhuma cobrança será feita.</p></div><div class="card">💬 Chat entre torcedores: integração online pendente.</div>'}
render();if(!favorite){section='club';render();}
</script></body></html>
