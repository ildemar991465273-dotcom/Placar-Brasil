plugins { id 'com.android.application' }
android {
 namespace 'br.com.golup.app'
 compileSdk 35
 defaultConfig { applicationId 'br.com.golup.app'; minSdk 23; targetSdk 35; versionCode 11; versionName '2.9.3' }
}

tasks.register('generateGolUpIcon') {
    doLast {
        def encoded = file('src/main/assets/golup_launcher.jpg.base64').text.trim()
        def output = file('src/main/res/drawable-nodpi/ic_golup.jpg')
        output.parentFile.mkdirs()
        output.bytes = java.util.Base64.getDecoder().decode(encoded)
    }
}
tasks.named('preBuild') { dependsOn('generateGolUpIcon') }

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
